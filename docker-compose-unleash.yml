services:
# ==================== Unleash ====================
  unleash:
    image: unleashorg/unleash-server:latest
    container_name: unleash
    restart: unless-stopped
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres_unleash:5432/unleash_db?schema=public
      DATABASE_SSL: "false"
      UNLEASH_ADMIN_INIT_PASSWORD: unleashadmin
      LOG_LEVEL: info
    depends_on:
      postgres_unleash:
        condition: service_healthy
    networks:
      - unleash-network

    # deploy:
    #   resources:
    #     limits:
    #       memory: 256M
    #       cpus: '0.20'
  postgres_unleash:
    image: postgres:14
    container_name: postgres_unleash
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unleash_db
      POSTGRES_SCHEMA: public
    volumes:
      - postgres_unleash_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unleash-network

volumes:
  postgres_unleash_data:

networks:
  unleash-network:
    driver: bridge